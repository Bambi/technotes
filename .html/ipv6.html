<h1>IPv6</h1>
<h2>Addresses</h2>
<ul>
<li>node-local: <code>::1/128</code>. Loopback.</li>
<li>link-local: <code>fe80::/10</code></li>
<li>global-unicast: <code>2000::/3</code>. Routable addresses with format:
<ul>
<li>global routing prefix (48 bits)</li>
<li>subnet id (16 bits)</li>
<li>interface id (64 bit)</li>
</ul>
</li>
<li>unique-local: <code>fc00::/7</code>. Not routable on public Internet.</li>
</ul>
